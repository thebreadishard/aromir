[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aromir"
dynamic = ["version"]
description = "Infrared spectra of aromatic molecules: a cheap DFT Hessian, a learned correction, and a certificate that says how far to trust each band."
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "src/aromir/releases/LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "Frederic Petrignani" }]
keywords = ["infrared spectroscopy", "PAH", "quantum chemistry", "Hessian", "machine learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    # The upper bounds of geometric, numpy, pyscf, rdkit, scipy and torch are the series
    # the package is tested with (README, Install): the atom order comes from RDKit, the
    # internal coordinates from geomeTRIC, and the pseudo-inverse incident of November
    # 2026 was one numpy build's. A newer series is allowed after
    # tests/test_order_pins.py and the release pins pass with it. pydantic and
    # safetensors are bounded at their next major version. pyscf is held at 2.15.0:
    # 2.15.1 (17 Nov 2026) passes the tests on Linux but cannot be installed on macOS on
    # Apple silicon — it has no wheel there, and its sdist lacks pyscf/lib/libxcfun.patch,
    # so every build from source fails. The bound moves when an arm64 wheel or a whole
    # sdist of a 2.15 release exists and the tests pass on it on every platform.
    "geometric>=1.1,<1.2",
    "numpy>=1.26,<2.6",
    "pydantic>=2.6,<3",
    "pyscf>=2.15,<2.15.1",
    "rdkit>=2023.9,<2026.10",
    "safetensors>=0.4,<1",
    "scipy>=1.11,<1.19",
    "torch>=2.2,<2.16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.5",
]

[project.scripts]
aromir = "aromir.cli:main"

[project.urls]
Repository = "https://github.com/thebreadishard/aromir"
Issues = "https://github.com/thebreadishard/aromir/issues"
Changelog = "https://github.com/thebreadishard/aromir/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aromir/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aromir"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing commas are the formatter's business
    "CPY001", # one LICENSE file, no notice per file
    "D203",   # one blank line before a class docstring: D211 is the chosen twin
    "D213",   # docstring summary on the second line: D212 is the chosen twin
    "N803",   # argument names: H, B, F and P are the paper's matrices
    "N806",   # variable names: the same notation inside functions
    "PLR2004", # a physical constant in a formula is not a magic number
    "RUF001", # −, × and Greek letters in strings are the formulas' own symbols
    "RUF002", # the same in docstrings
    "RUF003", # the same in comments
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D103",   # a test's name says what it checks
    "INP001", # tests are not a package
    "S101",   # assert is how pytest checks
]
"scripts/**" = [
    "INP001", # scripts are run by path, not imported
    "T201",   # a script reports on standard output
]

[tool.ruff.lint.isort]
known-first-party = ["aromir"]
known-local-folder = ["support"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["geometric.*", "pyscf.*", "rdkit.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = [
    "error",
    # pyscf leaves an SCF object's checkpoint file to the garbage collector
    "ignore:unclosed file:ResourceWarning",
    # pyscf's macOS wheels are built without OpenMP and say so when threads are set
    "ignore:OpenMP is not available:UserWarning",
]
markers = [
    "quantum: runs a quantum-chemistry calculation (seconds on water; deselect with -m 'not quantum')",
]

[tool.coverage.run]
branch = true
source = ["aromir"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]
