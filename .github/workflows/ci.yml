name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The network runs on the CPU; PyPI's default Linux wheel of torch bundles CUDA.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # The versions this job tested with: the README's sentence on them is read here.
      - run: pip list
      - run: pytest --cov --cov-report=term-missing

  rdkit-range:
    # The loader reads every SMILES of a release in admission's standard form, which is
    # RDKit's canonical SMILES: both ends of pyproject's RDKit range must load the shipped
    # releases, admit as the tests say and give the pinned atom order.
    name: RDKit ${{ matrix.rdkit }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lower bound, on the oldest Python. The first releases of 2025.3, 2025.9
          # and 2026.3 passed the same tests in run 44592464724.
          - rdkit: "2024.9.1"
            python: "3.11"
          # The highest allowed series, at its newest release.
          - rdkit: "2026.9.*"
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]" "rdkit==$RDKIT"
        env:
          RDKIT: ${{ matrix.rdkit }}
      - run: pip list
      - name: Load both bundled releases
        run: |
          python -c 'from aromir import release; [print(release.load(release.bundled().parent / v).network_version) for v in ("v1.3", "v1.4")]'
      - run: pytest -m "not quantum" tests/test_admission.py tests/test_bundled_release.py tests/test_certificate.py tests/test_order_pins.py tests/test_own_spread.py

  package:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install dist/*.whl && aromir --version
      # The installed wheel, not the checkout: outside it, the bundled releases load (every
      # record, hash and SMILES check of the loader), the card they write is the one shipped,
      # and `aromir evaluate` corrects a stored Hessian. No quantum chemistry runs.
      - name: Use the installed wheel's releases
        working-directory: ${{ runner.temp }}
        env:
          FIXTURE: ${{ github.workspace }}/tests/data/release/holdout_a_benzene.npz
        run: |
          releases="$(python -c 'import aromir.release as r; print(r.bundled().parent)')"
          case "$releases" in
            */site-packages/aromir/releases) ;;
            *) echo "aromir was imported from $releases, not from the wheel"; exit 1 ;;
          esac
          aromir check "c1ccc2ccccc2c1"
          aromir card --out card.md
          cmp card.md "$releases/v1.4/MODEL_CARD.md"
          aromir card --release "$releases/v1.3" --out card_v13.md
          cmp card_v13.md "$releases/v1.3/MODEL_CARD.md"
          mkdir -p test_sets/a && cp "$FIXTURE" test_sets/a/
          aromir evaluate test_sets --release "$releases/v1.3" --out measured.json
          python -c 'import json; m = json.load(open("measured.json")); assert m["a"]["n_molecules"] == 1, m'
